server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/uav/dist;
    index index.html;

    client_max_body_size 1m;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;

    # Internal subrequest used by auth_request.  It forwards the browser cookie
    # to the Python backend, which answers 200 or 401.
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The login page and auth endpoints are the only public entry points.
    location = /login.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed Vite assets can be cached for a long time.
    location /assets/ {
        auth_request /_auth;
        error_page 401 = @login;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /api/sites {
        auth_request /_auth;
        error_page 401 = @api401;
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
    }

    location ^~ /data/custom-sites/ {
        alias /opt/uav/custom-sites/;
        auth_request /_auth;
        error_page 401 = @login;
        autoindex off;
        disable_symlinks on;
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache" always;
        if ($uri !~ "^/data/custom-sites/(custom-[0-9a-f]{32})/\1-(gba(-meta)?\.json|terrain\.json|imagery\.(json|jpg))$") {
            return 404;
        }
    }

    # Large model files are immutable between deployments.
    location ~* \.(glb|jpg|jpeg|png|webp)$ {
        auth_request /_auth;
        error_page 401 = @login;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # JSON metadata may change on redeploy; revalidate instead of long caching.
    location ~* \.json$ {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/capabilities/ {
        auth_request /_auth;
        error_page 401 = @api401;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /api/project-chat {
        auth_request /_auth;
        error_page 401 = @api401;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_buffering off;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ /index.html;
    }

    location @login {
        return 302 /login.html?next=$uri;
    }

    location @api401 {
        default_type application/json;
        return 401 '{"error":"未登录或登录已过期"}';
    }
}
