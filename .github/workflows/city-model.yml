name: Build Zhengzhou city model
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-integration.txt
      - run: npm ci
      - run: npm run prepare:data
      - run: npm test
      - run: .venv/bin/python -m pytest backend/test_capabilities.py -q -p no:cacheprovider --basetemp=artifacts/test-api
      - run: .venv/bin/python -m pytest equipment_models/optical/tests -q -p no:cacheprovider --basetemp=artifacts/test-optical
      - run: .venv/bin/python -m pytest equipment_models/acoustic/tests -q -p no:cacheprovider --basetemp=artifacts/test-acoustic
      - run: npm run test:imagery
      - run: npm run plan:build
      - run: npm run build
      - run: npm run export:model
      - run: npm run report:sensors
      - uses: actions/upload-artifact@v4
        with:
          name: zhengzhou-city-model
          path: |
            dist/
            artifacts/zhengzhou-city-enu.glb
            public/data/report.json
            artifacts/sensor-model-report.json
            artifacts/deployment-report.json
