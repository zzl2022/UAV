name: Build Zhengzhou city model
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run prepare:data
      - run: npm test
      - run: npm run test:imagery
      - run: npm run build
      - run: npm run export:model
      - uses: actions/upload-artifact@v4
        with:
          name: zhengzhou-city-model
          path: |
            dist/
            artifacts/zhengzhou-city-enu.glb
            public/data/report.json
