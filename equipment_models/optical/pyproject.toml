[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-capability"
version = "0.1.0"
description = "Traceable, uncalibrated optical sensor and building LOS model"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "numpy>=1.26,<3", "shapely>=2,<3", "pyproj>=3.6,<4", "geopandas>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dem = ["rasterio>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
