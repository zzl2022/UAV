<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#02080f"/>
<title>登录 · 反无装备优化部署与仿真推演平台</title>
<style>
  :root{color-scheme:dark;--cyan:#7fe8ff;--muted:#8fb7c5;--line:#294b58;--panel:#0b1c25;--accent:#78d9bf}
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:
    radial-gradient(900px 520px at 50% -10%,rgba(38,113,138,.32),transparent 70%),
    radial-gradient(700px 460px at 90% 100%,rgba(224,120,45,.10),transparent 70%),
    #02080f;color:#dceef5;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
    background-image:linear-gradient(rgba(127,232,255,.14) 1px,transparent 1px),
      linear-gradient(90deg,rgba(127,232,255,.14) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(circle at 50% 35%,#000 0,transparent 72%)}
  .wrap{position:relative;width:min(960px,100%);display:grid;grid-template-columns:1.1fr .9fr;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(6,18,25,.92);
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(127,232,255,.05) inset}
  .intro{padding:46px 44px;background:
    linear-gradient(145deg,rgba(14,53,68,.9),rgba(4,14,21,.96));
    border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{width:54px;height:54px;border:1px solid rgba(127,232,255,.55);border-radius:50%;
    display:grid;place-items:center;color:var(--cyan);font-size:25px;box-shadow:0 0 24px rgba(80,210,255,.25) inset}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:5px}
  .brand strong{display:block;font-size:19px;letter-spacing:3px;color:#eaf9ff;font-weight:600}
  h1{margin:0;font-size:29px;line-height:1.45;letter-spacing:2px;color:#eefaff;font-weight:700}
  h1 em{display:block;font-style:normal;font-size:13px;letter-spacing:3px;color:var(--cyan);
    font-weight:500;margin-bottom:12px}
  .points{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:#9fc3cf;font-size:13px}
  .points li{display:flex;gap:9px;align-items:flex-start}
  .points li::before{content:"";width:6px;height:6px;margin-top:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);flex:0 0 auto}
  .panel{padding:46px 40px;display:flex;flex-direction:column;justify-content:center}
  .panel h2{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:1px}
  .panel p.sub{margin:0 0 28px;color:var(--muted);font-size:13px;line-height:1.7}
  label{display:block;font-size:12px;color:#b7d3dd;letter-spacing:1px;margin:0 0 8px}
  .field{position:relative;margin-bottom:18px}
  input{width:100%;height:46px;padding:0 14px;border:1px solid #31535f;border-radius:8px;
    background:#071720;color:#e8f7fb;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(127,232,255,.12)}
  .field input[type=password]{padding-right:72px}
  .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    color:#8fb7c5;font-size:12px;cursor:pointer;padding:6px}
  .actions{display:flex;align-items:center;gap:12px;margin-top:8px}
  button.submit{flex:1;height:46px;border:1px solid #78d9bf;border-radius:8px;background:#78d9bf;
    color:#0c2622;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:filter .2s}
  button.submit:hover{filter:brightness(1.08)}
  button.submit:disabled{opacity:.65;cursor:wait}
  .error{min-height:22px;margin:14px 0 0;color:#ff9b8e;font-size:12px;line-height:1.6}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid #233f4a;color:#6f94a2;
    font-size:11px;line-height:1.7}
  .logout{display:none;margin-top:18px;font-size:12px;color:var(--muted)}
  .logout a{color:var(--cyan)}
  @media(max-width:760px){
    .wrap{grid-template-columns:1fr}.intro{padding:30px 26px;border-right:0;border-bottom:1px solid var(--line);
      gap:22px}.intro .points{display:none}.panel{padding:32px 26px}h1{font-size:23px}
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="intro">
    <div>
      <div class="brand">
        <div class="mark" aria-hidden="true">◈</div>
        <div><strong>中国人民公安大学</strong><small>PEOPLE'S PUBLIC SECURITY UNIVERSITY OF CHINA</small></div>
      </div>
      <h1 style="margin-top:34px"><em>LOW-ALTITUDE DEFENSE · SIMULATION</em>反无装备优化部署<br>与仿真推演平台</h1>
    </div>
    <ul class="points">
      <li>三维环境建模 · 感知装备建模 · 部署仿真推演</li>
      <li>GBA LoD1 城市白模与高精度影像底图</li>
      <li>登录后访问全部模型、推演与导出功能</li>
    </ul>
  </section>
  <section class="panel">
    <h2>登录平台</h2>
    <p class="sub">请输入授权账号。未授权访问将被拦截。</p>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="toggle" id="toggle" type="button" aria-label="显示密码">显示</button>
      </div>
      <div class="actions"><button class="submit" id="submit" type="submit">登 录</button></div>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
      <p class="logout" id="logout-note">当前已登录，如需切换账号请<a href="/login.html?logout=1">退出登录</a>。</p>
    </form>
    <div class="foot">仅限项目授权人员使用。登录状态保存在浏览器 Cookie 中，有效期 12 小时。</div>
  </section>
</main>
<script>
  const form = document.getElementById('login-form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');
  const password = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  const logoutNote = document.getElementById('logout-note');
  const params = new URLSearchParams(location.search);
  const next = (() => {
    const value = params.get('next') || '/';
    if (!value.startsWith('/') || value.startsWith('//') || value.startsWith('/login.html')) return '/';
    return value;
  })();

  toggle.onclick = () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏' : '显示';
    toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  };

  async function boot() {
    if (params.get('logout') === '1') {
      try { await fetch('/api/auth/logout', {method: 'POST'}); } catch {}
      history.replaceState(null, '', '/login.html');
      return;
    }
    try {
      const response = await fetch('/api/auth/check', {cache: 'no-store'});
      if (response.ok) {
        logoutNote.style.display = 'block';
        location.replace(next);
      }
    } catch {}
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = '登录中…';
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: password.value,
        }),
      });
      if (response.ok) {
        location.replace(next);
        return;
      }
      let message = '登录失败，请重试';
      try {
        const data = await response.json();
        if (data && data.error) message = data.error;
      } catch {}
      if (response.status === 429) message = '尝试次数过多，请 10 分钟后再试';
      error.textContent = message;
    } catch (err) {
      error.textContent = '无法连接登录服务，请检查网络';
    } finally {
      submit.disabled = false;
      submit.textContent = '登 录';
    }
  });

  boot();
</script>
</body>
</html>
